  oxfmt_auto_fix:
    description: Whether this linter should try to fix code style issues automatically. If set to `true`, it will only work if "auto_fix" is set to `true` as well
    required: false
    default: 'true'

  oxlint:
    description: Enable or disable oxlint checks
    required: false
    default: 'false'
  oxlint_args:
    description: Additional arguments to pass to the linter
    required: false
    default: ''
  oxlint_dir:
    description: Directory where the oxlint command should be run
    required: false
  oxlint_extensions:
    description: Extensions of files to check with oxlint
    required: false
    default: 'none'
  oxlint_command_prefix:
    description: Shell command to prepend to the linter command. Will default to `npx --no-install` for NPM and `yarn run --silent` for Yarn.
    required: false
    default: ''
  oxlint_auto_fix:
    description: Whether this linter should try to fix code style issues automatically. If set to `true`, it will only work if "auto_fix" is set to `true` as well
    required: false
    default: 'true'

