name: Publish Lint Results
on:
  workflow_run:
    workflows: [Checks and Validation]
    types: [completed]

jobs:
  publish:
    name: Publish lint results
    runs-on: ubuntu-latest
    # Only fork PRs upload results, PRs from this repo create their check runs directly.
    # Never check out or run code from the PR here, this job has a write token
    if: github.event.workflow_run.head_repository.full_name != github.repository
    permissions:
      id-token: write
      actions: read
      contents: read
      checks: write
    steps:
      # Checks out the default branch, not the PR, so the action code is trusted
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: profiidev/gluon@d715c4a8bd804db764307ad041e73c1c60ec7382 # v0
        id: app-token
        with:
          url: https://gluon.profidev.io
          profile: publish

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: lint-results
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Publish lint results
        uses: ./
        with:
          publish_results: lint-results.json
          github_token: ${{ steps.app-token.outputs.token }}
