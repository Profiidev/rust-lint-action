name: Publish Lint Results
on:
  workflow_run:
    workflows: [Checks and Validation]
    types: [completed]

jobs:
  publish:
    name: Publish lint results
    runs-on: ubuntu-latest
    # Only fork PRs upload results, PRs from this repo create their check runs directly.
    # Never check out or run code from the PR here, this job has a write token
    if: github.event.workflow_run.head_repository.full_name != github.repository
    permissions:
      actions: read
      contents: read
      checks: write
    steps:
      # Checks out the default branch, not the PR, so the action code is trusted
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          client-id: ${{ secrets.COMMIT_BOT_CLIENT_ID }}
          private-key: ${{ secrets.COMMIT_BOT_PRIVATE_KEY }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: lint-results
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Publish lint results
        uses: ./
        with:
          publish_results: lint-results.json
          github_token: ${{ steps.app-token.outputs.token }}
