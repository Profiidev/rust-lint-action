name: Checks and Validation
on:
  pull_request:

jobs:
  linters:
    name: Run linters
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        if: github.event.pull_request.head.repo.full_name == github.repository
        with:
          client-id: ${{ secrets.COMMIT_BOT_CLIENT_ID }}
          private-key: ${{ secrets.COMMIT_BOT_PRIVATE_KEY }}
      - uses: bahmutov/npm-install@v1
      - name: Test Action
        uses: ./
        with:
          auto_fix: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          continue_on_error: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          results_file: ${{ github.event.pull_request.head.repo.full_name != github.repository && 'lint-results.json' || '' }}
          oxfmt: true
          oxlint: true
          tsc: true
          git_sign_commits: true
          github_token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Upload lint results
        if: always() && github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lint-results
          path: lint-results.json
          retention-days: 5
